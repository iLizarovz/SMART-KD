<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMART-KD Monitoring</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px;
           margin: 24px auto; padding: 0 16px; color: #222; }
    .grafik-scroll { overflow-x: auto; }
    canvas { display: block; border: 1px solid #ddd; }
    button { padding: 8px 14px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { padding: 8px; border-bottom: 1px solid #ddd; text-align: left; }
  </style>
</head>
<body>
  <h1>SMART-KD Monitoring</h1>
  <p>Garis biru: sampel suhu. Garis merah: alarm mulai.
     Garis hijau: alarm berakhir. Geser grafik untuk melihat seluruh titik.</p>
  <button id="muat">Muat ulang</button>
  <p id="status">Memuat data...</p>

  <div class="grafik-scroll">
    <canvas id="grafik" width="900" height="390"></canvas>
  </div>

  <h2>Kejadian alarm terbaru</h2>
  <table>
    <thead>
      <tr><th>Waktu diterima (WIB)</th><th>Kejadian</th>
          <th>Suhu</th><th>Perubahan</th></tr>
    </thead>
    <tbody id="daftar-alarm"></tbody>
  </table>

  <script>
    const URL_FUNGSI =
      "https://waklwxmzqeftmklicrfv.supabase.co/functions/v1/temperature-history";

    const canvas = document.getElementById("grafik");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const daftarAlarm = document.getElementById("daftar-alarm");

    function waktuWIB(nilai) {
      return new Intl.DateTimeFormat("id-ID", {
        timeZone: "Asia/Jakarta",
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hourCycle: "h23"
      }).format(new Date(nilai));
    }

    function gambarGrafik(samples, alarms) {
      const data = samples
        .map(s => ({
          t: Date.parse(s.received_at),
          v: Number(s.temperature_c)
        }))
        .filter(s => Number.isFinite(s.t) && Number.isFinite(s.v))
        .sort((a, b) => a.t - b.t);

      canvas.width = Math.max(900, data.length * 135 + 100);
      canvas.height = 390;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const kiri = 70, atas = 35, bawah = 305;
      const jarak = (canvas.width - kiri - 55) /
                    Math.max(1, data.length - 1);

      if (!data.length) {
        ctx.fillText("Belum ada sampel suhu yang valid.", kiri, atas);
        return;
      }

      const nilai = data.map(s => s.v);
      const rentang = Math.max(2, Math.max(...nilai) - Math.min(...nilai));
      const min = Math.min(...nilai) - rentang * 0.2;
      const max = Math.max(...nilai) + rentang * 0.2;
      const x = i => kiri + (data.length === 1 ? jarak / 2 : i * jarak);
      const y = v => bawah - (v - min) / (max - min) * (bawah - atas);

      ctx.strokeStyle = "#999";
      ctx.beginPath();
      ctx.moveTo(kiri, atas);
      ctx.lineTo(kiri, bawah);
      ctx.lineTo(canvas.width - 25, bawah);
      ctx.stroke();

      ctx.fillStyle = "#333";
      ctx.font = "12px Arial";
      ctx.fillText(max.toFixed(1) + " °C", 5, atas + 5);
      ctx.fillText(min.toFixed(1) + " °C", 5, bawah);

      // Tempatkan alarm menurut waktunya di antara dua sampel terdekat.
      for (const a of alarms) {
        const t = Date.parse(a.received_at);
        if (!Number.isFinite(t) || t < data[0].t ||
            t > data[data.length - 1].t) continue;

        let posisi = x(0);
        for (let i = 0; i < data.length - 1; i++) {
          if (t >= data[i].t && t <= data[i + 1].t) {
            const durasi = data[i + 1].t - data[i].t;
            const fraksi = durasi ? (t - data[i].t) / durasi : 0;
            posisi = x(i) + fraksi * (x(i + 1) - x(i));
            break;
          }
        }

        ctx.strokeStyle = a.event_type === "start"
          ? "#c62828" : "#2e7d32";
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(posisi, atas);
        ctx.lineTo(posisi, bawah);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      ctx.strokeStyle = "#1769aa";
      ctx.lineWidth = 2;
      ctx.beginPath();
      data.forEach((s, i) => {
        if (i === 0) ctx.moveTo(x(i), y(s.v));
        else ctx.lineTo(x(i), y(s.v));
      });
      ctx.stroke();

      data.forEach((s, i) => {
        const posisi = x(i);
        ctx.fillStyle = "#1769aa";
        ctx.beginPath();
        ctx.arc(posisi, y(s.v), 4, 0, 2 * Math.PI);
        ctx.fill();

        ctx.textAlign = "center";
        ctx.font = "12px Arial";
        ctx.fillText(s.v.toFixed(2) + " °C", posisi, y(s.v) - 11);

        const [tanggal, jam] = waktuWIB(s.t).split(", ");
        ctx.fillStyle = "#333";
        ctx.font = "11px Arial";
        ctx.fillText(jam || "", posisi, bawah + 20);
        ctx.fillText(tanggal, posisi, bawah + 36);
      });
      ctx.textAlign = "start";
    }

    function tampilkanAlarm(alarms) {
      daftarAlarm.replaceChildren();
      for (const a of [...alarms].reverse()) {
        const baris = document.createElement("tr");
        for (const isi of [
          waktuWIB(a.received_at),
          a.event_type,
          a.temperature_c == null ? "-" : a.temperature_c + " °C",
          a.change_c == null ? "-" : a.change_c + " °C"
        ]) {
          const sel = document.createElement("td");
          sel.textContent = isi;
          baris.appendChild(sel);
        }
        daftarAlarm.appendChild(baris);
      }
    }

    async function muatData() {
      statusEl.textContent = "Memuat data...";
      try {
        const respons = await fetch(URL_FUNGSI);
        if (!respons.ok) throw new Error("HTTP " + respons.status);
        const data = await respons.json();
        if (!Array.isArray(data.samples) ||
            !Array.isArray(data.alarms)) {
          throw new Error("Format respons tidak sesuai");
        }
        gambarGrafik(data.samples, data.alarms);
        tampilkanAlarm(data.alarms);
        statusEl.textContent = `${data.samples.length} sampel dan ` +
          `${data.alarms.length} kejadian alarm dimuat.`;
      } catch (galat) {
        statusEl.textContent = "Gagal memuat data: " + galat.message;
      }
    }

    document.getElementById("muat").addEventListener("click", muatData);
    muatData();
    setInterval(() => {
      if (!document.hidden) muatData();
    }, 60000);
  </script>
</body>
</html>
